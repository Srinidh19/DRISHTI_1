name: DRISHTI CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Permissions for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1. CI: Quality Assurance & Production Build
  build:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Verify Types & Build Production Bundle
        env:
          VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY || 'gcPEyo4bpUmJepU12DyL' }}
          VITE_MAP_PROVIDER: "maptiler"
          VITE_MAP_STYLE: "hybrid"
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '/api' }}
        run: npm run build

      - name: Verify Build Integrity & SPA Fallbacks
        run: |
          test -f dist/index.html || exit 1
          test -f dist/_redirects || exit 1
          test -f dist/404.html || exit 1
          echo "Production build verified successfully."

      - name: Package Pages Artifact
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # 2. CD: Automatic Deployment to GitHub Pages (Live DRISHTI Platform)
  deploy:
    name: Continuous Deployment (Live Production)
    needs: build
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
