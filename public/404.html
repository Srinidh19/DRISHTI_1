<!DOCTYPE html>

    <title>DRISHTI — Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages & Static Hosts
      // Store the requested path in sessionStorage and redirect to index.html
      var path = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('drishti_redirect_path', path);
      window.location.replace('/');
    </script>
  </head>

    </div>
